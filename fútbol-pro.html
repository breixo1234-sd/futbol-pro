<script>

['Cambios de dirección en zigzag','Agilidad y coordinación','Frenar y girar rápido','Conos','Conos en zigzag a 3 m|Corre hasta cada cono y cambia de dirección|Baja el cuerpo al girar','6 series',8,'Media','Cruzar los pies; girar con el cuerpo alto',[8,7]],
['Sentadilla con peso corporal','Fuerza de piernas','Fuerza de piernas','Ninguno','Pies al ancho de hombros|Baja con la espalda recta hasta casi paralelo|Sube empujando con los talones','3 series de 10',10,'Fácil','Rodillas hacia dentro; talones levantados',[9]],

['Golpeo con la pierna no dominante','Finalización y golpeo','Ganar confianza con la pierna menos hábil','Balón, portería o pared','Balón parado|Golpea con el empeine de la pierna menos hábil|Apunta a una esquina|Aleja la distancia poco a poco','4 series de 8',12,'Media','Evitarla en partido; golpear con la punta',[11,12,13]]];
const by=(a,k,r)=>[...a].sort((x,y)=>((x[k]||'')>(y[k]||'')?1:-1)*(r?-1:1));
let S,tab='home',sub={tr:'week',st:'matches'},wk=mon(today),fd='Todas',fc='Todas',persist=true;
try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){persist=false}
function seed(){const m=mon(today),d=n=>addD(m,n),p=n=>addD(today,-n),id=uid;
return{me:{name:'',pos:'Sin definir',team:''},

ex:[['Rondo 4 contra 1','Pase rápido y primer toque','En un cuadrado de 8x8 m, cuatro jugadores pasan y uno presiona. Máximo dos toques. Quien pierde el balón pasa al centro.',12,'Media'],
['Conducción en eslalon','Control del balón en carrera','Coloca 8 conos separados 1,5 m. Conduce el balón con el interior y el exterior de ambos pies, sin tocar los conos. Vuelve trotando.',10,'Fácil'],
['Remate tras pared','Finalización','Pasa a un compañero, recibe de primera y remata a puerta. Alterna pierna derecha e izquierda en cada serie.',15,'Media'],
['Arranques cortos con balón','Velocidad de salida','Series de 10 a 15 m: arranca con el balón controlado, para y vuelve andando. Descansa entre series y calienta antes.',10,'Difícil'],
['Control y pase a la pared','Primer toque','A 3 m de una pared, pasa y controla con un toque. Cambia de pie cada minuto.',8,'Fácil']].map(([name,goal,how,dur,dif])=>({id:id(),name,goal,how,dur,dif})),
well:[[4,3,6,'Ninguna',''],[3,4,8,'Leve','Gemelo'],[2,2,4,'Ninguna',''],[1,3,6,'Ninguna',''],[0,2,5,'Ninguna','']].map(([a,fat,rpe,pain,zone])=>({id:id(),demo:1,date:p(a),fat,rpe,pain,zone}))}}
function load(){try{const r=localStorage.getItem(K);if(r){S=JSON.parse(r);if(S&&S.plan&&S.matches&&S.ex&&S.well){mig();return}}}catch(e){}S=seed();mig()}
function mig(){S.body=S.body||[];S.hts=S.hts||[];S.sk=S.sk||{};S.me=S.me||{};
S.well.forEach(w=>{w.pain={Leve:PAIN[2],Moderada:PAIN[2],Fuerte:PAIN[3]}[w.pain]||w.pain});
if(!S.xv2){S.xv2=1;S.ex=S.ex.filter(e=>!OLD.includes(e.name));S.ex.push(...XT.map(([name,cat,goal,mat,how,dose,dur,dif,err,t])=>({id:uid(),name,cat,goal,mat,how:how.split('|').join('\n'),dose,dur,dif,err,tags:t.map(i=>SK[i])})))}save()}
const doneToday=()=>S.well.some(w=>w.date===today&&!w.demo),prio=()=>[...(S.sk.prio||[])],fd2=s=>s.split('-').reverse().join('/');
function start(){if(!S.sk.asked){S.sk.asked=1;save();skills(1)}else daily()}
function daily(){if(!doneToday()&&S.sk.skip!==today)checkin()}
function checkin(){let f=0,p=PAIN[0],z='';const o=document.createElement('div');o.className='ov';
const ph=()=>{const s0=o.firstChild?o.firstChild.scrollTop:0;o.innerHTML=`<div class='md'><h2>¿Cómo de cansado te encuentras hoy?</h2><div style='display:grid;gap:6px;margin-top:10px'>${LV.map((t,i)=>`<button class='${f===i+1?'p':''}' data-f='${i+1}'>${i+1} · ${t}</button>`).join('')}</div><label>¿Dolor muscular o molestias? (opcional)</label><div style='display:grid;gap:6px'>${PAIN.map((q,i)=>`<button class='${p===q?'p':''}' data-p='${i}'>${q}</button>`).join('')}</div><p class='mu'>El cansancio normal no es lo mismo que el dolor. Si algo te duele, indícalo.</p><label for='z'>Zona (si hay dolor)</label><input id='z' maxlength='60' value='${esc(z)}'><div class='err' id='ce'></div><div class='row' style='margin-top:14px'><button data-n>Ahora no</button><button class='p' data-ok>Guardar</button></div></div>`;

return `<div class="card"${d===today?' style="border-color:var(--g)"':''}><div class="row"><h3>${fmt(d)}${d===today?' (hoy)':''}</h3><button class="sm p" onclick="edit('plan',0,{date:'${d}'})">+ Añadir</button></div>${L.length?L.map(pRow).join(''):'<p class="mu" style="margin-bottom:0">Sin planes este día.</p>'}</div>`}).join('')}
function exV(){const L=S.ex.filter(e=>fd==='Todas'||e.dif===fd);
return `<div class="row"><select onchange="fd=this.value;render()" aria-label="Filtrar por dificultad">${['Todas',...DIF].map(o=>`<option${o===fd?' selected':''}>${o}</option>`).join('')}</select><button class="p" style="white-space:nowrap" onclick="edit('ex')">+ Ejercicio</button></div>`+
(L.length?L.map(e=>`<div class="card"><div class="row"><h3>${esc(e.name)}</h3><span class="tag">${e.dif}</span></div><div class="mu">${e.dur} min · Objetivo: ${esc(e.goal)}</div><details><summary>Ver instrucciones</summary><p>${esc(e.how)}</p></details><div class="row" style="margin-top:10px;justify-content:flex-start;flex-wrap:wrap"><button class="sm p" onclick="addEx('${e.id}')">Añadir al plan de hoy</button>${act('ex',e.id)}</div></div>`).join(''):'<p class="mu">No hay ejercicios con esa dificultad. Añade uno nuevo.</p>')}
function maV(){const M=S.matches,sum=k=>M.reduce((a,m)=>a+m[k],0);
return `<button class="p" style="width:100%" onclick="edit('matches',0,{date:'${today}'})">+ Registrar partido</button><div class="grid">${st(M.length,'Partidos')}${st(sum('goals'),'Goles')}${st(sum('assists'),'Asistencias')}${st(sum('min'),'Minutos')}${st(M.length?(sum('rate')/M.length).toFixed(1):'-','Valoración media')}</div>`+
(M.length?by(M,'date',1).map(m=>`<div class="card"><div class="row"><h3>vs. ${esc(m.rival)}</h3><span class="mu">${fmt(m.date)}</span></div><div>${m.goals} goles · ${m.assists} asist. · ${m.min} min · valoración ${m.rate}/10</div>${m.notes?`<div class="mu">${esc(m.notes)}</div>`:''}<div class="row" style="justify-content:flex-end;margin-top:8px">${act('matches',m.id)}</div></div>`).join(''):'<p class="mu">Todavía no has registrado partidos. Pulsa el botón verde para añadir el primero.</p>')}
function weV(){const L=by(S.well,'date',1);
return `<button class="p" style="width:100%" onclick="edit('well',0,{date:'${today}'})">+ Registro de hoy</button>`+(L.length?recCard(L[0])+L.map(w=>`<div class="card"><div class="row"><h3>${fmt(w.date)}</h3><span class="mu">Cansancio ${w.fat}/5 · Esfuerzo ${w.rpe}/10</span></div><div>Molestias: ${w.pain}${w.zone?' ('+esc(w.zone)+')':''}</div><div class="row" style="justify-content:flex-end;margin-top:8px">${act('well',w.id)}</div></div>`).join(''):'<p class="mu">Aún no hay registros. Anota cómo te sientes para recibir recomendaciones de recuperación.</p>')}
function editMe(){edMe()}
const hasDemo=()=>['plan','matches','well'].some(c=>S[c].some(x=>x.demo));
function ldDemo(){const s=seed();['plan','matches','well'].forEach(c=>S[c].push(...s[c]));save();render();toast('Ejemplos cargados')}
function clrDemo(){ask('¿Borrar solo los datos de ejemplo? Tus datos propios se conservan.',()=>{['plan','matches','well'].forEach(c=>S[c]=S[c].filter(x=>!x.demo));save();render();toast('Ejemplos borrados')})}
function clrAll(){ask('¿Borrar TODOS tus datos (plan, partidos, ejercicios y bienestar)?',()=>{S={me:S.me,plan:[],matches:[],ex:[],well:[],body:[],hts:[],sk:S.sk};mig();render();toast('Datos borrados')})}
function shw(){$('#bk').value=JSON.stringify(S);toast('Datos mostrados. Pulsa Copiar.')}
function cpy(){const t=$('#bk');if(!t.value)shw();t.select();const done=()=>toast('Copiado. Pégalo en un lugar seguro.'),fb=()=>{let k=false;try{k=document.execCommand('copy')}catch(e){}if(k)done();else toast('No se pudo copiar solo: el texto está seleccionado, cópialo a mano.',1)};try{navigator.clipboard.writeText(t.value).then(done,fb)}catch(e){fb()}}
function imp(){let d;try{d=JSON.parse($('#bk').value)}catch(e){return toast('El texto no es una copia válida de Fútbol Pro.',1)}
if(!d||!['plan','matches','ex','well'].every(k=>Array.isArray(d[k])))return toast('Falta información: la copia no está completa.',1);
ask('Importar reemplaza los datos actuales. ¿Continuar?',()=>{S={me:d.me||{},plan:d.plan,matches:d.matches,ex:d.ex,well:d.well,body:d.body||[],hts:d.hts||[],sk:d.sk||{},xv2:d.xv2};mig();render();toast('Copia importada')})}
function prV(){const m=S.me;return `<h1>Perfil</h1>${pCard()}${prCard()}
<div class="card"><h3>Datos de ejemplo</h3><p class="mu">Son ficticios y sirven para ver cómo funciona la app.</p><div class="row">${hasDemo()?'<button onclick="clrDemo()">Borrar ejemplos</button>':'<button onclick="ldDemo()">Cargar ejemplos</button>'}<button class="d" onclick="clrAll()">Borrar todo</button></div></div>
<div class="card"><h3>Copia de seguridad</h3><p class="mu">${persist?'Tus datos se guardan en este navegador y dispositivo, y no se envían a ningún sitio.':'Este entorno no permite guardar datos al cerrar. Usa la copia para no perderlos.'} Si borras los datos del navegador se pierden: copia el texto de vez en cuando. Para recuperar una copia, pégala aquí y pulsa Importar.</p><textarea id="bk" rows="5" aria-label="Copia de seguridad"></textarea><div class="row" style="margin-top:10px"><button onclick="shw()">Mostrar datos</button><button onclick="cpy()">Copiar</button><button class="p" onclick="imp()">Importar</button></div></div>`}
const NV=[['home','Inicio','<path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/>'],['tr','Entrenamientos','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],['st','Estadísticas','<path d="M5 21V11M12 21V4M19 21v-7"/>'],['me','Perfil','<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>']];
function render(){const v={home:homeV,tr:()=>'<h1>Entrenamientos</h1>'+seg('tr',[['week','Semana'],['ses','Mi sesión'],['ex','Ejercicios']])+(sub.tr==='week'?weekV():sub.tr==='ses'?sesV():exV2()),st:()=>'<h1>Estadísticas</h1>'+seg('st',[['matches','Partidos'],['well','Bienestar'],['body','Cuerpo']])+(sub.st==='matches'?maV():sub.st==='well'?weV2():boV()),me:prV}[tab]();
$('main').innerHTML=v;
$('nav').innerHTML=NV.map(([k,l,p])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"${tab===k?' aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg><span>${l}</span></button>`).join('')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.querySelector('.ov');if(o)o.remove()}});
load();render();start();
</script></body></html>
